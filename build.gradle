plugins {
    id 'java'
    id 'jacoco'
    id 'pmd'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
    id "com.diffplug.spotless" version '6.25.0'
}

group = 'com.socialapp'
version = '0.0.1-SNAPSHOT'

// Spring Boot 3.2.5 manages an older Testcontainers release by default; override it so the
// version pulled in by the testcontainers-bom import below (dependencies block) actually wins.
ext['testcontainers.version'] = '1.21.3'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // Health endpoint. Trước đây không có gì để hỏi "dịch vụ còn sống không": docker-compose
    // dùng depends_on trần (chỉ đợi container khởi động, không đợi ứng dụng sẵn sàng), Dockerfile
    // không có HEALTHCHECK, và Caddy thì cứ chuyển tiếp request tới backend dù nó đã chết.
    // Chỉ endpoint `health` được phơi ra, không kèm chi tiết — xem khối `management` trong
    // application.yml.
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // OpenAPI spec + Swagger UI. The generated /v3/api-docs is the contract the frontend
    // generates its TypeScript types from, so a renamed DTO field breaks the FE build instead
    // of silently 404-ing at runtime. Disabled via SPRINGDOC_ENABLED=false in production.
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'

    // Flyway
    implementation 'org.flywaydb:flyway-core:10.20.1'
    implementation 'org.flywaydb:flyway-database-postgresql:10.20.1'
    runtimeOnly 'org.postgresql:postgresql'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly  'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly  'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // WebClient (for external API calls)
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // Neo4j
    implementation 'org.springframework.boot:spring-boot-starter-data-neo4j'

    // MinIO
    implementation 'io.minio:minio:8.5.10'

    // Book preview generation (PDF page slicing, EPUB chapter slicing)
    implementation 'org.apache.pdfbox:pdfbox:3.0.7'
    implementation('com.positiondev.epublib:epublib-core:3.1') {
        // Pulls in slf4j-simple, which fights logback-classic for the SLF4J provider slot and
        // crashes Spring Boot's LogbackLoggingSystem on startup. We only need epublib's API.
        exclude group: 'org.slf4j', module: 'slf4j-simple'
    }

    // Axiom Logback Appender
    implementation 'io.github.yhsj:axiom-appender:1.0.2'
    implementation 'net.logstash.logback:logstash-logback-encoder:7.4'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Test
    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
    }

    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.mockito:mockito-junit-jupiter'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Testcontainers
    testImplementation platform('org.testcontainers:testcontainers-bom:1.21.3')
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:neo4j'
    testImplementation 'org.testcontainers:minio'

    // No official Testcontainers module for Redis; GenericContainer + redis image is used instead.
    testImplementation 'org.testcontainers:testcontainers'
}

tasks.named('test') {
    useJUnitPlatform()
    // Activates src/test/resources/application-test.yml (test-only JWT secret, disabled
    // scheduling/moderation, etc.) for every test context, including @WebMvcTest slices that
    // don't declare @ActiveProfiles("test") themselves.
    systemProperty 'spring.profiles.active', 'test'
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = 0.80
            }
        }
    }
}

tasks.named('check') {
    dependsOn jacocoTestCoverageVerification
}

pmd {
    // Production code only — test classes legitimately rack up rule-count/method-count that
    // isn't a real design smell (many @Test methods per class, one per behavior).
    sourceSets = [sourceSets.main]
    ruleSetFiles = files('config/pmd/ruleset.xml')
    ruleSets = []
    // Report-only for now: surfaces every SOLID/OOP design violation on each build without
    // breaking a build that's currently green. Flip to false once the existing backlog (see
    // build/reports/pmd/main.html) has been triaged and is intentionally kept at zero.
    ignoreFailures = true
    consoleOutput = true
}

spotless {
    format 'misc', {
        target '*.gradle', '.gitattributes', '.gitignore'
        trimTrailingWhitespace()
        indentWithSpaces(3)
        endWithNewline()
        setEncoding('utf-8')
    }
    java {
        removeUnusedImports()
        googleJavaFormat('1.22.0').reorderImports(false).skipJavadocFormatting()
        indentWithSpaces(2)
        trimTrailingWhitespace()
        importOrder('\\#', 'java.', 'org.', 'com.')
        endWithNewline()
        toggleOffOn('// spotless:off', '// spotless:on')
    }
}
