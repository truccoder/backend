# minio.url is baked directly into t_users.profile_picture_url / t_books.cover_image_url at
# upload time (ProfileService/BookStorageService) — must be the publicly reachable address
# *before* any uploads happen in an environment, since existing DB rows won't be rewritten
# retroactively if this changes later.
minio:
  url: ${MINIO_URL:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minio_admin}
  secret-key: ${MINIO_SECRET_KEY:minio_admin_password}

spring:
  servlet:
    multipart:
      # Spring Boot's own defaults (1MB/file, 10MB/request) were silently rejecting anything
      # over 1MB with a 413 before ProfileService's own 5MB check ever ran, even though
      # ProfileService.MAX_PROFILE_PICTURE_SIZE documents a 5MB limit. Sized with headroom for
      # profile pictures and book cover/preview uploads.
      max-file-size: 20MB
      max-request-size: 25MB

  mail:
    # MAIL_* are what the prod deploy (DATN-infra docker-compose.prod.yml) injects;
    # GOOGLE_APP_PASSWORD is kept as the local-dev fallback.
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:thanhtre3651@gmail.com}
    password: ${MAIL_PASSWORD:${GOOGLE_APP_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/socialapp}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  flyway:
    schemas: socialapp
    default-schema: socialapp
    validate-on-migrate: false

  jpa:
    hibernate:
      ddl-auto: none
    # Spring Boot defaults this to true, which keeps the Hibernate session open through view
    # rendering — lazy associations then resolve silently during JSON serialization, hiding
    # missing fetch joins and turning list endpoints into N+1 query storms. Off, so an
    # un-fetched association fails loudly in tests instead of quietly in production.
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        default_schema: socialapp

  data:
    redis:
      host: localhost
      port: 6379

  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: neo4j_password

# Defaults to on for local dev so the frontend can regenerate its types from /v3/api-docs.
# Production must set SPRINGDOC_ENABLED=false — the spec enumerates every endpoint and DTO
# field, which is reconnaissance material, and Swagger UI is a live request console.
springdoc:
  # Serialize every JSON map with its keys sorted. Without this, schema properties come
  # out in whatever order reflection produced for that JVM run: stable while the process
  # lives, different after a restart. The frontend commits the generated types and relies
  # on `git diff` being empty to detect contract drift, so a restart-dependent ordering
  # buried real changes under ~13k lines of reshuffling.
  writer-with-order-by-keys: true
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /swagger-ui.html
    # Endpoints grouped by tag (one tag per controller) rather than one flat list of 100+.
    tags-sorter: alpha
    operations-sorter: alpha

cache:
  default-ttl: 30m
  jitter-percent: 10
  lock-ttl: 5s
  lock-retry-delay: 100ms
  lock-max-retries: 50

moderation:
  enabled: true
  text-moderation:
    toxicity-threshold: 0.7
    review-threshold: 0.5
  cloud-vision:
    enabled: false
    api-key: ${GOOGLE_CLOUD_VISION_API_KEY:}
    reject-likelihood: VERY_LIKELY
    review-likelihood: POSSIBLE
  rules:
    keyword-blacklist-path: classpath:moderation/blacklist.txt

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: 900000
  refresh-token-expiration-ms: 604800000

auth:
  reset-password-url: ${RESET_PASSWORD_URL:http://localhost:3000/reset-password?token=}
  verify-email-url: ${VERIFY_EMAIL_URL:http://localhost:3000/verify-email?token=}
  magic-link-url: ${MAGIC_LINK_URL:http://localhost:3000/magic-login?token=}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: gemini-2.5-flash-lite
  base-url: https://generativelanguage.googleapis.com/v1beta
  max-output-tokens: 8192
  temperature: 0.7

stream:
  chat:
    api-key: ${STREAM_API_KEY:}
    api-secret: ${STREAM_API_SECRET:}
    base-url: ${STREAM_BASE_URL:https://chat.stream-io-api.com}
    token-ttl: ${STREAM_TOKEN_TTL:24h}

trending:
  crawl-interval-ms: 3600000

onesignal:
  app-id: ${ONESIGNAL_APP_ID:}
  rest-api-key: ${ONESIGNAL_REST_API_KEY:}

mail:
  from-email: ${MAIL_FROM_EMAIL:thanhtre3651@gmail.com}
  from-name: ${MAIL_FROM_NAME:SocialApp}

google:
  calendar:
    client-id: ${GOOGLE_CALENDAR_CLIENT_ID:}
    client-secret: ${GOOGLE_CALENDAR_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_CALENDAR_REDIRECT_URI:http://localhost:8080/v1/api/events/google/callback}

  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
    client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:3000/oauth/google/callback}

github:
  oauth:
    client-id: ${GITHUB_OAUTH_CLIENT_ID:}
    client-secret: ${GITHUB_OAUTH_CLIENT_SECRET:}
    # Sign in with GitHub.
    redirect-uri: ${GITHUB_OAUTH_REDIRECT_URI:http://localhost:3000/oauth/github/callback}
    # Link GitHub to an account that is already signed in. Must be a DIFFERENT route from the one
    # above, and both must be registered on the GitHub OAuth app. A GitHub code is single-use, so
    # sharing one callback meant the login handler consumed the code the link flow needed and
    # linking never worked (B23a).
    link-redirect-uri: ${GITHUB_OAUTH_LINK_REDIRECT_URI:http://localhost:3000/settings/github/callback}

# MoMo AIO v2 sandbox. partner-code/access-key/secret-key default to MoMo's own publicly
# published test credentials (github.com/momo-wallet/payment) so this works out of the box
# against test-payment.momo.vn; override once you have your own sandbox merchant.
momo:
  partner-code: ${MOMO_PARTNER_CODE:MOMO}
  access-key: ${MOMO_ACCESS_KEY:F8BBA842ECF85}
  secret-key: ${MOMO_SECRET_KEY:K951B6PE1waDMi640xX08PD3vg6EkVlz}
  api-url: ${MOMO_API_URL:https://test-payment.momo.vn}
  redirect-url: ${MOMO_REDIRECT_URL:http://localhost:3000/payment/success}
  ipn-url: ${MOMO_IPN_URL:http://localhost:8080/v1/api/payments/momo/webhook}

# Anonymous read surface (the discovery feed, a public post, a public profile and its posts,
# trending, reputation, GitHub stats, books by author). Those endpoints have no user id to hold
# responsible, so the only handle left for a bulk crawl is the caller's IP.
#
# trust-forwarded-for stays FALSE unless this service sits behind a reverse proxy that overwrites
# X-Forwarded-For: any client can set that header itself, so trusting it without a proxy means a
# scraper sends a fresh fake IP per request and the limit protects nothing.
rate-limit:
  guest:
    enabled: ${GUEST_RATE_LIMIT_ENABLED:true}
    requests: ${GUEST_RATE_LIMIT_REQUESTS:60}
    window: ${GUEST_RATE_LIMIT_WINDOW:1m}
    trust-forwarded-for: ${GUEST_RATE_LIMIT_TRUST_XFF:false}
