# minio.url được NƯỚNG THẲNG vào cột nào, và không nướng vào cột nào — hai nhóm này hành xử khác
# hẳn nhau khi địa chỉ MinIO đổi:
#
#   Nướng sẵn URL tuyệt đối, KHÔNG viết lại được về sau:
#     t_users.profile_picture_url, t_users.cover_image_url, t_posts.images
#     (ProfileService, MediaService). Trình duyệt tải thẳng, không qua backend.
#
#   Chỉ lưu KEY, backend ký URL tạm thời mỗi lần phục vụ:
#     t_books.file_key / cover_image_key / preview_file_key (BookStorageService).
#     Nhóm này tự đúng theo minio.url hiện tại, đổi địa chỉ không ảnh hưởng.
#     (Cột sách từng tên là cover_image_url và từng nướng URL; V44 đổi sang key.)
#
# Vì nhóm thứ nhất không viết lại được, giá trị này phải là địa chỉ công khai truy cập được
# *trước khi* có bất kỳ lần tải lên nào trong một môi trường.
minio:
  url: ${MINIO_URL:http://localhost:9000}
  # Địa chỉ app DÙNG ĐỂ GỌI MinIO (upload, stat, tạo bucket, đặt policy). Bỏ trống ⇒ dùng luôn
  # minio.url. Production đặt về địa chỉ mạng nội bộ (http://minio:9000) để việc tạo bucket + đặt
  # policy public-read KHÔNG phụ thuộc reverse proxy đã sẵn sàng hay chưa — lần khởi động đầu,
  # Caddy chưa lên, lệnh đặt policy fail lặng lẽ và mọi ảnh seed trả 403. URL ký sẵn của sách vẫn
  # ký theo minio.url (xem MinIOConfig#minioPresignClient).
  internal-url: ${MINIO_INTERNAL_URL:}
  access-key: ${MINIO_ACCESS_KEY:minio_admin}
  secret-key: ${MINIO_SECRET_KEY:minio_admin_password}

spring:
  servlet:
    multipart:
      # Spring Boot's own defaults (1MB/file, 10MB/request) were silently rejecting anything
      # over 1MB with a 413 before ProfileService's own 5MB check ever ran, even though
      # ProfileService.MAX_PROFILE_PICTURE_SIZE documents a 5MB limit. Sized with headroom for
      # profile pictures and book cover/preview uploads.
      max-file-size: 20MB
      max-request-size: 25MB

  mail:
    # MAIL_* are what the prod deploy (DATN-infra docker-compose.prod.yml) injects;
    # GOOGLE_APP_PASSWORD is kept as the local-dev fallback.
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:thinhtpts00865@fpt.edu.vn}
    password: ${MAIL_PASSWORD:${GOOGLE_APP_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/socialapp}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

    hikari:
      # Tất cả các giá trị dưới đây trước kia đều để mặc định. Mặc định của Hikari hợp lý cho một
      # database chạy cùng máy; production thì đi qua pooler của Supabase ở đầu kia Internet, nơi
      # mỗi kết nối đắt hơn và có thời hạn riêng.

      # 10 kết nối cho 2 vCPU. Pool lớn hơn KHÔNG nhanh hơn: số truy vấn chạy song song bị chặn bởi
      # số nhân CPU và đĩa của database, còn kết nối thừa chỉ thêm tranh chấp và chiếm chỗ trong
      # hạn mức của pooler. Supabase giới hạn số kết nối theo gói, và đây không phải instance duy
      # nhất nối vào đó.
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2

      # Chờ tối đa 10 giây để mượn được một kết nối. Mặc định là 30 giây, nghĩa là khi pool cạn thì
      # request nằm im nửa phút rồi mới báo lỗi — người dùng đã bỏ đi từ lâu, mà thread vẫn bị giữ.
      connection-timeout: 10000

      # Phải NHỎ HƠN thời gian pooler/database tự đóng kết nối nhàn rỗi, nếu không Hikari sẽ đưa ra
      # một kết nối mà đầu kia đã bỏ, và lỗi hiện ra dưới dạng "connection reset" ngẫu nhiên rất
      # khó truy. 20 phút là mức thận trọng so với ngưỡng thường gặp.
      max-lifetime: 1200000
      idle-timeout: 300000
      validation-timeout: 3000

      # Ghi log kèm stack trace khi một kết nối bị giữ quá 30 giây mà chưa trả. Không tự sửa được
      # gì, nhưng nó chỉ thẳng vào đoạn code làm rò rỉ — thứ mà nếu không có thì chỉ biểu hiện
      # thành "pool cạn" ở một chỗ hoàn toàn khác.
      leak-detection-threshold: 30000

      # Đặt trần thời gian cho MỌI câu lệnh, ngay ở phía server. Đây là lớp bảo vệ cuối: một truy
      # vấn thiếu index quét toàn bảng sẽ bị Postgres tự huỷ sau 15 giây thay vì giữ kết nối và
      # kéo cả pool xuống theo.
      connection-init-sql: SET statement_timeout = '15s'

  flyway:
    schemas: socialapp
    default-schema: socialapp
    validate-on-migrate: false

    # Ba nhóm location, ba mức độ an toàn khác nhau:
    #
    #   db/migration  — schema. Chạy ở mọi nơi.
    #   db/seed       — nội dung demo + 500 tài khoản. Chạy ở dev VÀ production (quyết định
    #                   2026-08-21). Mật khẩu seed là hash bcrypt GHI CỨNG trong file seed, KHÔNG
    #                   phải placeholder — đánh đổi có ý thức, vì mật khẩu demo phải in được vào
    #                   tài liệu bảo vệ đồ án. Runbook production nhắc đổi mật khẩu hai tài khoản
    #                   admin qua API ngay sau khi seed xong.
    #
    # Từ 2026-08-28 chỉ còn HAI nhóm. Thư mục db/seed-dev đã bị xoá: nó ra đời để giữ ba personal
    # access token — credential dùng được ngay — nhưng người dùng tự tạo token qua
    # POST /v1/api/tokens trong vài giây, nên ba token seed sẵn chỉ đổi lấy ba credential nằm công
    # khai trong repo. Bỏ token đi thì lý do tách thư mục biến mất theo, và hai môi trường từ nay
    # khai giống hệt nhau.
    #
    # Mặc định ở đây là migration-only, và đó vẫn là lựa chọn đúng: chạy app không cấu hình gì thì
    # không nên tự đổ 500 tài khoản vào database. Mỗi môi trường tự khai mình muốn gì.
    #
    #   dev đầy đủ:
    #     FLYWAY_LOCATIONS=classpath:db/migration,classpath:db/seed
    #   production: xem application-prod.yml — GIỐNG HỆT dòng trên
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}

    # Any database seeded before this split still has V20/V21/V25/V29/V30 recorded in
    # flyway_schema_history while no longer resolving them locally, which is exactly what
    # validation reports as "applied migration not resolved locally". Ignoring *:missing keeps
    # those databases migratable — and is what makes it safe to turn validate-on-migrate on.
    ignore-migration-patterns: "*:missing"

    # Giá trị đổ vào ${minioUrl} trong db/seed. Ảnh của bộ seed phải mang URL TUYỆT ĐỐI (trình
    # duyệt tải thẳng, không qua backend), mà địa chỉ MinIO thì khác nhau giữa máy dev và
    # production — nên URL không ghi cứng được trong SQL, và cũng không để NULL được nữa kể từ khi
    # seed có ảnh thật.
    #
    # Flyway thay placeholder ở TẦNG ĐỌC FILE, trước khi parse SQL: một chuỗi ${...} lọt vào file
    # seed mà không được khai ở đây sẽ giết migration với "No value provided for placeholder",
    # KỂ CẢ khi nó nằm trong một dòng comment. Đã xảy ra đúng một lần ở V51.
    #
    # Sai giá trị này thì không có gì báo lỗi: URL vẫn hợp lệ, chỉ là trỏ vào nơi không có object,
    # và toàn bộ ảnh của bộ seed hỏng im lặng.
    placeholders:
      minioUrl: ${MINIO_URL:http://localhost:9000}

  jpa:
    hibernate:
      ddl-auto: none
    # Spring Boot defaults this to true, which keeps the Hibernate session open through view
    # rendering — lazy associations then resolve silently during JSON serialization, hiding
    # missing fetch joins and turning list endpoints into N+1 query storms. Off, so an
    # un-fetched association fails loudly in tests instead of quietly in production.
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        default_schema: socialapp
        # Tran thoi gian o tang JDBC cho moi truy van JPA. Bo sung cho statement_timeout phia
        # server o tren, khong thay the: cai kia do Postgres huy truy van, cai nay do driver bo
        # cuoc. Co ca hai thi du truy van bi treo o dau cung co mot ben chiu trach nhiem ket thuc.
        jakarta:
          persistence:
            query:
              timeout: 15000

  data:
    redis:
      host: localhost
      port: 6379

  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: neo4j_password

# Defaults to on for local dev so the frontend can regenerate its types from /v3/api-docs.
# Production must set SPRINGDOC_ENABLED=false — the spec enumerates every endpoint and DTO
# field, which is reconnaissance material, and Swagger UI is a live request console.
springdoc:
  # Serialize every JSON map with its keys sorted. Without this, schema properties come
  # out in whatever order reflection produced for that JVM run: stable while the process
  # lives, different after a restart. The frontend commits the generated types and relies
  # on `git diff` being empty to detect contract drift, so a restart-dependent ordering
  # buried real changes under ~13k lines of reshuffling.
  writer-with-order-by-keys: true
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /swagger-ui.html
    # Endpoints grouped by tag (one tag per controller) rather than one flat list of 100+.
    tags-sorter: alpha
    operations-sorter: alpha

# Chỉ phơi ra endpoint sức khoẻ, và không kèm chi tiết.
#
# `include: health` là danh sách trắng: mọi endpoint actuator khác (env, beans, mappings,
# configprops, heapdump, threaddump) đều không được đăng ký. Chúng phơi biến môi trường, chuỗi
# kết nối và toàn bộ sơ đồ đường dẫn — không thứ nào nên có mặt trên một tiến trình production.
#
# Trên deployment thật, Caddy chỉ route /v1/* tới backend và backend không publish cổng nào ra
# host, nên /actuator không tới được từ Internet. Cấu hình ở đây là lớp thứ hai, cho trường hợp
# tuyến đường đó thay đổi.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # never, không phải when-authorized: chi tiết sức khoẻ liệt kê từng thành phần phụ thuộc
      # kèm thông tin phiên bản và lỗi kết nối — đó là bản đồ hạ tầng cho người dò quét.
      show-details: never
      show-components: never
      # Bật /actuator/health/liveness và /actuator/health/readiness.
      probes:
        enabled: true
      group:
        # readiness = "container này nhận traffic được chưa". Đây là thứ HEALTHCHECK trong
        # Dockerfile và `condition: service_healthy` trong compose hỏi tới.
        #
        # Có `db`, KHÔNG có redis/neo4j. Mất Postgres thì gần như mọi endpoint đều hỏng nên đưa
        # vào là đúng. Còn Redis hoặc Neo4j hỏng chỉ làm hỏng một phần tính năng (bảng tin cá
        # nhân, danh sách bạn bè) trong khi phần còn lại vẫn phục vụ được — để chúng vào nhóm này
        # nghĩa là một cú chớp của Redis tự loại cả dịch vụ khỏi vòng phục vụ, biến một sự cố cục
        # bộ thành sự cố toàn phần. Với deployment một instance, tự loại mình ra không cứu được ai.
        readiness:
          include: readinessState, db
        # liveness = "tiến trình này còn cứu được không, hay phải khởi động lại". Cố ý KHÔNG có
        # phụ thuộc ngoài nào: khởi động lại tiến trình không làm database sống lại, nó chỉ thêm
        # một vòng khởi động vào giữa lúc đang có sự cố.
        liveness:
          include: livenessState
  health:
    # Health check của mail mở một kết nối SMTP thật tới Gmail mỗi lần được gọi. Với healthcheck
    # chạy 30 giây một lần thì đó là hàng nghìn lượt bắt tay SMTP mỗi ngày chỉ để hỏi một câu mà
    # không endpoint nào cần biết câu trả lời ngay lập tức.
    mail:
      enabled: false

cache:
  default-ttl: 30m
  jitter-percent: 10
  lock-ttl: 5s
  lock-retry-delay: 100ms
  lock-max-retries: 50

moderation:
  # Mặc định BẬT, và production phải để nguyên như vậy: tắt kiểm duyệt nghĩa là mọi nội dung lên
  # thẳng feed công khai không qua lọc.
  #
  # Trước đây chỗ này bị sửa cứng thành `false` cho buổi demo 2026-08-09 rồi nằm lại trong working
  # tree — một lần commit nhầm là production chạy không kiểm duyệt mà không ai thấy gì bất thường.
  # Chuyển thành biến môi trường để việc tắt là một quyết định của môi trường cụ thể, có thời hạn,
  # chứ không phải một dòng sửa trong file dùng chung:
  #
  #   demo/dev muốn tắt:  MODERATION_ENABLED=false
  #
  # Khi bật, bài viết được lưu ở PENDING_MODERATION và `publishSavedPost` return trước khi fan-out
  # — bài chưa hiện ở `/posts/public` (đòi APPROVED) lẫn `/feed` (đọc Redis) cho tới khi
  # `ModerationEventListener` chấm xong rồi mới gọi `fanOutPost`. Đây là độ trễ của một luồng
  # @Async, không phải bài bị mất; nếu Gemini lỗi thì bài rơi về PENDING_REVIEW cho người duyệt.
  enabled: ${MODERATION_ENABLED:true}
  text-moderation:
    toxicity-threshold: 0.7
    review-threshold: 0.5
  cloud-vision:
    enabled: false
    api-key: ${GOOGLE_CLOUD_VISION_API_KEY:}
    reject-likelihood: VERY_LIKELY
    review-likelihood: POSSIBLE
  rules:
    keyword-blacklist-path: classpath:moderation/blacklist.txt
  reports:
    # Bao nhiêu NGƯỜI khác nhau phải báo cáo trước khi bài bị đưa vào hàng chờ duyệt.
    #
    # Không để 1: `PostVisibilityService` giấu mọi bài không phải APPROVED khỏi tất cả trừ tác giả,
    # nên ngưỡng 1 biến mỗi tài khoản thành một nút gỡ bài. Ràng buộc UNIQUE (post_id, reporter_id)
    # ở V62 là thứ khiến con số này đếm người chứ không đếm lượt bấm.
    #
    # Môi trường demo có ít tài khoản có thể hạ xuống 2 bằng MODERATION_REPORT_THRESHOLD.
    escalation-threshold: ${MODERATION_REPORT_THRESHOLD:3}

notifications:
  sse:
    # Nhịp giữ kết nối SSE. Proxy và mạng di động cắt kết nối im lặng sau một tới hai phút, nên
    # một khung dữ liệu định kỳ vừa giữ đường mở vừa làm lộ ra đường đã chết (ghi thất bại →
    # emitter bị gỡ → client tự kết nối lại). Xem NotificationStreamService.
    heartbeat-ms: ${NOTIFICATIONS_SSE_HEARTBEAT_MS:25000}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: 900000
  refresh-token-expiration-ms: 604800000

auth:
  reset-password-url: ${RESET_PASSWORD_URL:http://localhost:3000/reset-password?token=}
  verify-email-url: ${VERIFY_EMAIL_URL:http://localhost:3000/verify-email?token=}
  magic-link-url: ${MAGIC_LINK_URL:http://localhost:3000/magic-login?token=}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Khoá AES-256 (base64, 32 byte) dùng để mã hoá các cột chứa token OAuth của bên thứ ba —
# access token GitHub, và cặp access/refresh token Google Calendar. Xem EncryptedStringConverter.
#
# KHÔNG có giá trị mặc định, và đó là chủ ý: một khoá mặc định nằm trong repo thì tương đương không
# mã hoá gì cả. Thiếu khoá thì việc LIÊN KẾT tài khoản GitHub/Google bị từ chối (503), phần còn lại
# của ứng dụng vẫn chạy bình thường.
#
# Sinh khoá:  openssl rand -base64 32
#
# Đổi khoá thì các token đã mã hoá bằng khoá cũ không đọc được nữa — người dùng phải liên kết lại.
security:
  column-encryption-key: ${COLUMN_ENCRYPTION_KEY:}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: gemini-2.5-flash-lite
  base-url: https://generativelanguage.googleapis.com/v1beta
  max-output-tokens: 8192
  temperature: 0.7

stream:
  chat:
    api-key: ${STREAM_API_KEY:}
    api-secret: ${STREAM_API_SECRET:}
    base-url: ${STREAM_BASE_URL:https://chat.stream-io-api.com}
    token-ttl: ${STREAM_TOKEN_TTL:24h}

trending:
  crawl-interval-ms: 3600000

onesignal:
  app-id: ${ONESIGNAL_APP_ID:}
  rest-api-key: ${ONESIGNAL_REST_API_KEY:}

mail:
  from-email: ${MAIL_FROM_EMAIL:thinhtpts00865@fpt.edu.vn}
  from-name: ${MAIL_FROM_NAME:SocialApp}

google:
  calendar:
    client-id: ${GOOGLE_CALENDAR_CLIENT_ID:}
    client-secret: ${GOOGLE_CALENDAR_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_CALENDAR_REDIRECT_URI:http://localhost:8080/v1/api/events/google/callback}

  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
    client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:3000/oauth/google/callback}

github:
  oauth:
    client-id: ${GITHUB_OAUTH_CLIENT_ID:}
    client-secret: ${GITHUB_OAUTH_CLIENT_SECRET:}
    # Sign in with GitHub.
    redirect-uri: ${GITHUB_OAUTH_REDIRECT_URI:http://localhost:3000/oauth/github/callback}
    # Link GitHub to an account that is already signed in. Must be a DIFFERENT route from the one
    # above, and both must be registered on the GitHub OAuth app. A GitHub code is single-use, so
    # sharing one callback meant the login handler consumed the code the link flow needed and
    # linking never worked (B23a).
    link-redirect-uri: ${GITHUB_OAUTH_LINK_REDIRECT_URI:http://localhost:3000/settings/github/callback}

# MoMo AIO v2 sandbox. partner-code/access-key/secret-key default to MoMo's own publicly
# published test credentials (github.com/momo-wallet/payment) so this works out of the box
# against test-payment.momo.vn; override once you have your own sandbox merchant.
momo:
  partner-code: ${MOMO_PARTNER_CODE:MOMO}
  access-key: ${MOMO_ACCESS_KEY:F8BBA842ECF85}
  secret-key: ${MOMO_SECRET_KEY:K951B6PE1waDMi640xX08PD3vg6EkVlz}
  api-url: ${MOMO_API_URL:https://test-payment.momo.vn}
  # Which flow MoMo's hosted page offers. captureWallet is wallet/QR and is the only value
  # measured to settle on the sandbox; payWithATM gives the card-entry screen, which is easier to
  # demo by hand but parks at resultCode 7002 for ever there — pair it with the `dev` profile's
  # POST /v1/api/payments/{transactionRef}/dev-settle to reach COMPLETED. See
  # MomoProperties#requestType for the measurements.
  request-type: ${MOMO_REQUEST_TYPE:payWithATM}
  redirect-url: ${MOMO_REDIRECT_URL:http://localhost:3000/payment/success}
  ipn-url: ${MOMO_IPN_URL:http://localhost:8080/v1/api/payments/momo/webhook}

# Anonymous read surface (the discovery feed, a public post, a public profile and its posts,
# trending, reputation, GitHub stats, books by author). Those endpoints have no user id to hold
# responsible, so the only handle left for a bulk crawl is the caller's IP.
#
# trust-forwarded-for stays FALSE unless this service sits behind a reverse proxy that overwrites
# X-Forwarded-For: any client can set that header itself, so trusting it without a proxy means a
# scraper sends a fresh fake IP per request and the limit protects nothing.
rate-limit:
  guest:
    enabled: ${GUEST_RATE_LIMIT_ENABLED:true}
    requests: ${GUEST_RATE_LIMIT_REQUESTS:60}
    window: ${GUEST_RATE_LIMIT_WINDOW:1m}
    trust-forwarded-for: ${GUEST_RATE_LIMIT_TRUST_XFF:false}

  # Giới hạn cho /v1/api/auth/**, chặt hơn hẳn phần khách vãng lai ở trên.
  #
  # Cây đường dẫn này buộc phải permitAll — chưa đăng nhập thì lấy đâu ra token — và trước đây
  # KHÔNG có gì giới hạn nó cả. Bộ lọc khách vãng lai không phủ tới: danh sách đường dẫn của nó là
  # bề mặt ĐỌC công khai, còn auth không nằm trong đó. Nghĩa là những endpoint đáng tấn công nhất
  # lại là những endpoint duy nhất không có trần: đoán mật khẩu ở /login, và gửi mail không giới
  # hạn ở /forgot-password với /magic-link.
  #
  # Hai hạn mức, hai khoá đếm khác nhau, vì chúng chặn hai kiểu lạm dụng khác nhau:
  #   requests/window          — theo IP nguồn, chặn dò mật khẩu
  #   mail-requests/mail-window — theo ĐỊA CHỈ NHẬN, chặn việc dội mail vào hòm thư người khác
  #                               từ nhiều IP mà mỗi IP đều nằm dưới hạn mức trên
  # Hạn mức theo NGƯỜI DÙNG cho các endpoint tốn tiền thật (hiện là /knowledge/.../explain).
  #
  # Hai bộ lọc ở trên không phủ tới: guest thoát ngay khi người gọi đã đăng nhập, còn auth chỉ áp
  # cho /v1/api/auth/**. Nghĩa là trước đây một tài khoản hợp lệ chạy vòng lặp trên endpoint gọi
  # Gemini không gặp trần nào — và vì kiểm duyệt nội dung dùng CHUNG khoá Gemini, tiêu hết hạn mức
  # nghĩa là kiểm duyệt cũng ngừng hoạt động.
  costly:
    enabled: ${COSTLY_RATE_LIMIT_ENABLED:true}
    ai-requests: ${AI_RATE_LIMIT_REQUESTS:20}
    ai-window: ${AI_RATE_LIMIT_WINDOW:1h}

  auth:
    enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
    requests: ${AUTH_RATE_LIMIT_REQUESTS:20}
    window: ${AUTH_RATE_LIMIT_WINDOW:5m}
    mail-requests: ${AUTH_RATE_LIMIT_MAIL_REQUESTS:3}
    mail-window: ${AUTH_RATE_LIMIT_MAIL_WINDOW:15m}
    trust-forwarded-for: ${GUEST_RATE_LIMIT_TRUST_XFF:false}

# Timeout cho mọi lời gọi HTTP đi ra ngoài. Xem WebClientTimeoutConfig — trước đây không WebClient
# nào có timeout, nên một upstream nhận kết nối rồi im lặng sẽ giữ thread Tomcat vô hạn.
http-client:
  connect-timeout: ${HTTP_CONNECT_TIMEOUT:5s}
  response-timeout: ${HTTP_RESPONSE_TIMEOUT:20s}
  ai-response-timeout: ${HTTP_AI_RESPONSE_TIMEOUT:60s}
