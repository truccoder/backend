# Test profile overrides. Datasource/Redis/Neo4j/MinIO connection properties are injected at
# runtime by AbstractIntegrationTest via @DynamicPropertySource once the Testcontainers are
# started, so they are intentionally not hardcoded here.

scheduling:
  enabled: false

spring:
  mail:
    host: localhost
    port: 3025
    username: test@example.com
    password: test
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  flyway:
    enabled: true
    validate-on-migrate: false

moderation:
  enabled: false
  cloud-vision:
    enabled: false

onesignal:
  app-id: test-app-id
  rest-api-key: test-rest-api-key

gemini:
  api-key: test-gemini-api-key

jwt:
  secret: testSecretKeyForIntegrationTestsOnlyDoNotUseInProduction123456

# Off for tests: the limiter counts in Redis, and a @WebMvcTest slice has no Redis. The filter's
# own behaviour is covered by GuestRateLimitFilterTest, which drives it directly.
rate-limit:
  guest:
    enabled: false
  # Tat luon o test, cung ly do voi guest: cac slice @WebMvcTest khong co Redis, va cac bai
  # integration test goi /login nhieu lan lien tiep se tu dam vao han muc 20 request neu de bat.
  # Rieng hanh vi cua bo loc duoc kiem chung o AuthRateLimitFilterTest, noi Redis duoc mock.
  auth:
    enabled: false
